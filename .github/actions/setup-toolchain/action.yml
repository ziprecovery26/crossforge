name: "CrossForge · Setup toolchain"
description: >-
  Installs the universal cross-compile toolchain: Node, Bun, Go, Rust + cargo-zigbuild,
  Zig, and (optionally) the Android NDK r27. Every step is idempotent and cheap when
  the tool is not needed.

inputs:
  bun-version:
    description: "Bun version (empty = skip)"
    required: false
    default: ""
  node-version:
    description: "Node version used for node-gyp / native addon build scripts"
    required: false
    default: "24"
  go-version:
    description: "Go version (empty = skip)"
    required: false
    default: ""
  rust:
    description: "Install Rust + cargo-zigbuild + zig"
    required: false
    default: "false"
  rust-targets:
    description: "Extra rustup targets (comma separated)"
    required: false
    default: ""
  zig-version:
    description: "Zig version installed alongside Rust (cargo-zigbuild needs it)"
    required: false
    default: "0.15.2"
  ndk:
    description: "Download Android NDK r27c"
    required: false
    default: "false"
  ndk-version:
    description: "NDK version string"
    required: false
    default: "27c"
  apt-packages:
    description: "Extra apt packages to install (space separated)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      if: inputs.node-version != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      if: inputs.bun-version != ''
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Go
      if: inputs.go-version != ''
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Base packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          build-essential python3 python3-pip pkg-config \
          zip unzip tar xz-utils zstd file jq \
          ${{ inputs.apt-packages }}
        python3 -m pip install --quiet --break-system-packages setuptools || true
        # node-gyp is required by several native postinstall scripts
        npm i -g node-gyp@latest >/dev/null 2>&1 || true
        echo "node-gyp: $(command -v node-gyp || echo missing)"

    - name: Setup Rust + cargo-zigbuild
      if: inputs.rust == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install stable --profile minimal --no-self-update
        rustup default stable

        if [ -n "${{ inputs.rust-targets }}" ]; then
          IFS=',' read -ra TARGETS <<< "${{ inputs.rust-targets }}"
          for t in "${TARGETS[@]}"; do
            t="$(echo "$t" | xargs)"
            [ -n "$t" ] && rustup target add "$t" || true
          done
        fi

        # zig + cargo-zigbuild give us glibc/musl/macOS cross-linkers without a
        # macOS machine. We install both from *prebuilt* artifacts — `cargo install`
        # compiles from source and was taking ~15 minutes on the runners.
        ZIG_VERSION="${{ inputs.zig-version }}"

        if ! command -v zig >/dev/null 2>&1 || ! zig version >/dev/null 2>&1; then
          ZIG_URL=""
          ZIG_URL="$(curl -fsSL https://ziglang.org/download/index.json 2>/dev/null \
            | jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball // empty' 2>/dev/null || true)"
          [ -n "$ZIG_URL" ] || ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "downloading $ZIG_URL"
          if curl -fsSL --retry 3 -o /tmp/zig.tar.xz "$ZIG_URL"; then
            sudo mkdir -p /opt/zig && sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
            sudo ln -sf /opt/zig/zig /usr/local/bin/zig
            rm -f /tmp/zig.tar.xz
          else
            echo "::warning::zig download failed ($ZIG_URL)"
          fi
        fi
        if command -v zig >/dev/null 2>&1; then echo "zig: $(zig version)"; else echo "::warning::zig unavailable"; fi

        if ! command -v cargo-zigbuild >/dev/null; then
          CZB_VERSION="$(curl -fsSL https://api.github.com/repos/rust-cross/cargo-zigbuild/releases/latest 2>/dev/null | jq -r .tag_name 2>/dev/null || true)"
          [ -n "$CZB_VERSION" ] || CZB_VERSION="v0.23.4"
          CZB_URL="https://github.com/rust-cross/cargo-zigbuild/releases/download/${CZB_VERSION}/cargo-zigbuild-x86_64-unknown-linux-gnu.tar.xz"
          echo "downloading $CZB_URL"
          if curl -fsSL --retry 3 -o /tmp/czb.tar.xz "$CZB_URL" \
             && tar -xJf /tmp/czb.tar.xz -C /tmp \
             && sudo install -m 0755 /tmp/cargo-zigbuild /usr/local/bin/cargo-zigbuild; then
            echo "cargo-zigbuild installed from release ${CZB_VERSION}"
          else
            echo "::warning::prebuilt cargo-zigbuild unavailable, falling back to cargo install (~15 min)"
            cargo install --locked cargo-zigbuild || true
          fi
        fi
        cargo-zigbuild --version 2>/dev/null || echo "::warning::cargo-zigbuild unavailable"

    - name: Setup Android NDK
      if: inputs.ndk == 'true'
      shell: bash
      run: |
        set -euo pipefail
        NDK_VERSION="${{ inputs.ndk-version }}"
        NDK_DIR="$RUNNER_TEMP/android-ndk-r${NDK_VERSION}"
        if [ ! -d "$NDK_DIR" ]; then
          echo "Downloading Android NDK r${NDK_VERSION} (~700 MB)"
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/ndk.zip"
        fi
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
        echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
        "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

    - name: Toolchain summary
      shell: bash
      run: |
        {
          echo "### 🧰 Toolchain"
          echo ""
          echo "| tool | version |"
          echo "|---|---|"
          for t in node npm bun go rustc cargo zig cargo-zigbuild clang; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "| $t | \`$($t --version 2>&1 | head -1)\` |"
            fi
          done
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

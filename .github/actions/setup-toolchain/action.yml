name: "CrossForge · Setup toolchain"
description: >-
  Installs the universal cross-compile toolchain: Node, Bun, Go, Rust + cargo-zigbuild,
  Zig, and (optionally) the Android NDK r27. Every step is idempotent and cheap when
  the tool is not needed.

inputs:
  bun-version:
    description: "Bun version (empty = skip)"
    required: false
    default: ""
  node-version:
    description: "Node version used for node-gyp / native addon build scripts"
    required: false
    default: "24"
  go-version:
    description: "Go version (empty = skip)"
    required: false
    default: ""
  rust:
    description: "Install Rust + cargo-zigbuild + zig"
    required: false
    default: "false"
  rust-targets:
    description: "Extra rustup targets (comma separated)"
    required: false
    default: ""
  ndk:
    description: "Download Android NDK r27c"
    required: false
    default: "false"
  ndk-version:
    description: "NDK version string"
    required: false
    default: "27c"
  apt-packages:
    description: "Extra apt packages to install (space separated)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      if: inputs.node-version != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      if: inputs.bun-version != ''
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Setup Go
      if: inputs.go-version != ''
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Base packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          build-essential python3 python3-pip pkg-config \
          zip unzip tar xz-utils zstd file jq \
          ${{ inputs.apt-packages }}
        python3 -m pip install --quiet --break-system-packages setuptools || true
        # node-gyp is required by several native postinstall scripts
        npm i -g node-gyp@latest >/dev/null 2>&1 || true
        echo "node-gyp: $(command -v node-gyp || echo missing)"

    - name: Setup Rust + cargo-zigbuild
      if: inputs.rust == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install stable --profile minimal --no-self-update
        rustup default stable

        if [ -n "${{ inputs.rust-targets }}" ]; then
          IFS=',' read -ra TARGETS <<< "${{ inputs.rust-targets }}"
          for t in "${TARGETS[@]}"; do
            t="$(echo "$t" | xargs)"
            [ -n "$t" ] && rustup target add "$t" || true
          done
        fi

        # zig + cargo-zigbuild give us glibc/musl/macOS cross-linkers without a macOS machine.
        # `pip install ziglang` ships the full zig binary inside the package dir; we
        # symlink it onto PATH so `zig` works everywhere (cargo-zigbuild needs it).
        if ! command -v zig >/dev/null 2>&1 || ! zig version >/dev/null 2>&1; then
          pip3 install --quiet --break-system-packages ziglang 2>/dev/null \
            || pip install --quiet ziglang 2>/dev/null || true
          ZIG_PATH="$(python3 -c "import ziglang, os; print(os.path.join(os.path.dirname(ziglang.__file__), 'zig'))" 2>/dev/null || true)"
          if [ -n "$ZIG_PATH" ] && [ -x "$ZIG_PATH" ]; then
            sudo ln -sf "$ZIG_PATH" /usr/local/bin/zig
            echo "zig symlinked: $ZIG_PATH"
          fi
        fi
        command -v zig >/dev/null 2>&1 && zig version || echo "::warning::zig unavailable — cargo-zigbuild cross-linking will not work"

        if ! command -v cargo-zigbuild >/dev/null; then
          cargo install --locked cargo-zigbuild
        fi
        cargo-zigbuild --version 2>/dev/null || true

    - name: Setup Android NDK
      if: inputs.ndk == 'true'
      shell: bash
      run: |
        set -euo pipefail
        NDK_VERSION="${{ inputs.ndk-version }}"
        NDK_DIR="$RUNNER_TEMP/android-ndk-r${NDK_VERSION}"
        if [ ! -d "$NDK_DIR" ]; then
          echo "Downloading Android NDK r${NDK_VERSION} (~700 MB)"
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/ndk.zip"
        fi
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
        echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
        "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

    - name: Toolchain summary
      shell: bash
      run: |
        {
          echo "### 🧰 Toolchain"
          echo ""
          echo "| tool | version |"
          echo "|---|---|"
          for t in node npm bun go rustc cargo zig cargo-zigbuild clang; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "| $t | \`$($t --version 2>&1 | head -1)\` |"
            fi
          done
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

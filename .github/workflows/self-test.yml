# ==============================================================================
# CrossForge · self-test
# ------------------------------------------------------------------------------
# Har push/PR par repo ki sanity: JSON, YAML, shell syntax, shellcheck,
# actionlint, registry consistency aur issue-parser tests.
# ==============================================================================
name: self-test

on:
  push:
    branches: [main]
    paths-ignore: [".state/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq python3-yaml shellcheck curl
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/

      - name: Run self-test
        run: bash scripts/self-test.sh

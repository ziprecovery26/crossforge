# ==============================================================================
# CrossForge · build request
# ------------------------------------------------------------------------------
# Jab koi maintainer request issue ko `cf:approved` label deta hai, tab:
#   1. license dobara verify hota hai (deny-list → reject)
#   2. recipe registry/rules me auto-generate + commit hota hai (naya project ho to)
#   3. pura build pipeline chalta hai aur result issue par comment hota hai
# ==============================================================================
name: build request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  actions: write
  id-token: write
  attestations: write

jobs:
  register:
    if: ${{ github.event.label.name == 'cf:approved' }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.recipe.outputs.proceed }}
      project: ${{ steps.recipe.outputs.project }}
      targets: ${{ steps.recipe.outputs.targets }}
      ref: ${{ steps.recipe.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: 🔎 Parse the request + re-verify license
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > /tmp/issue.md
          bash scripts/lib/parse-issue.sh /tmp/issue.md "Repository URL" > /tmp/repo.txt
          SLUG="$(sed -E 's#^https?://(www\.)?github\.com/##; s#\.git$##; s#/+$##' < /tmp/repo.txt)"
          echo "$SLUG" > /tmp/slug.txt
          [ -n "$SLUG" ] || { echo "::error::Repository URL missing in issue body"; exit 1; }
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

          SPDX="$(gh api "repos/$SLUG" --jq '.license.spdx_id // "NOASSERTION"' 2>/dev/null || echo "NOASSERTION")"
          echo "spdx=$SPDX" >> "$GITHUB_OUTPUT"

          ALLOWED="$(jq -r '.allowlist.licenses[]' registry/index.json)"
          DENIED="$(jq -r '.allowlist.deny[]' registry/index.json)"

          if echo "$DENIED" | grep -qx "$SPDX"; then
            echo "deny=$SPDX" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$ALLOWED" | grep -qx "$SPDX"; then
            echo "allow=true" >> "$GITHUB_OUTPUT"
          else
            echo "unknown=$SPDX" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚫 Reject (license)
        if: ${{ steps.request.outputs.deny != '' || (steps.request.outputs.allow != 'true' && steps.request.outputs.unknown != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPDX: ${{ steps.request.outputs.deny || steps.request.outputs.unknown }}
        run: |
          set -euo pipefail
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          🚫 **Request reject — license check fail**

          Detected license: \`$SPDX\`

          CrossForge sirf OSI-approved open-source licenses wale projects build karta hai
          (MIT, Apache-2.0, BSD, GPL, MPL, ISC, Unlicense…).

          Agar repo par license file hai lekin GitHub ise detect nahi kar pa raha, to
          maintainer manually review karke \`cf:approved\` de sakta hai.
          EOF
          )"
          gh issue edit "${{ github.event.issue.number }}" --add-label "cf:license-blocked" --remove-label "cf:approved" || true

      - name: 🧾 Write / update the recipe
        id: recipe
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.request.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2129  # repeated appends to $GITHUB_OUTPUT are idiomatic in Actions
          # earlier step may have decided to stop
          if [ "${{ steps.request.outputs.deny || steps.request.outputs.unknown }}" != "" ] && [ "${{ steps.request.outputs.allow }}" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          ID="$(bash scripts/lib/parse-issue.sh /tmp/issue.md "Project name" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9._-')"
          [ -n "$ID" ] || ID="$(basename "$SLUG" | tr -cd 'a-zA-Z0-9._-')"
          RECIPE="registry/$ID.json"

          if [ ! -f "$RECIPE" ]; then
            echo "naya project — recipe generate kar raha hoon: $RECIPE"
            bash scripts/lib/make-recipe.sh --body /tmp/issue.md --out "$RECIPE" --issue "$ISSUE"
            # fill the verified license
            jq --arg spdx "${{ steps.request.outputs.spdx }}" \
               '.license = {spdx: $spdx, redistributable: true, notes: "verified by build-request workflow"}' \
               "$RECIPE" > "$RECIPE.tmp" && mv "$RECIPE.tmp" "$RECIPE"

            # index update
            jq --arg id "$ID" --arg slug "$SLUG" --arg rec "./$ID.json" --arg spdx "${{ steps.request.outputs.spdx }}" \
               --argjson targets "$(jq '.targets' "$RECIPE")" \
               '.projects += [{id:$id, name:$id, repo:$slug, license:$spdx, buildSystem: "custom",
                               recipe:$rec, targets:$targets, nightly:false, enabled:true}]' \
               registry/index.json > registry/index.json.tmp && mv registry/index.json.tmp registry/index.json

            git config user.name "crossforge-bot"
            git config user.email "crossforge-bot@users.noreply.github.com"
            git add "$RECIPE" registry/index.json
            git commit -m "feat(registry): add $ID (request #$ISSUE)"
            # race-safe: koi aur request beech me push kar de to rebase karke try karo
            git push || { git pull --rebase --autostash && git push; }
          fi

          TARGETS_CSV="$(jq -r '(.defaultTargets // .targets) | join(",")' "$RECIPE")"
          REF_VALUE="$(jq -r '.upstream.ref' "$RECIPE")"
          {
            echo "project=$ID"
            echo "targets=$TARGETS_CSV"
            echo "ref=$REF_VALUE"
            echo "proceed=true"
          } >> "$GITHUB_OUTPUT"
          echo "recipe: $RECIPE (targets=$TARGETS_CSV ref=$REF_VALUE)"

      - name: 💬 Ack comment
        if: ${{ steps.recipe.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "$(cat <<EOF
          ✅ **Approved — build queue me daal diya**

          | | |
          |---|---|
          | project | \`${{ steps.recipe.outputs.project }}\` |
          | license | \`${{ steps.request.outputs.spdx }}\` |
          | ref | \`${{ steps.recipe.outputs.ref }}\` |
          | targets | \`${{ steps.recipe.outputs.targets }}\` |

          Build GitHub Actions par chal raha hai (swap memory enabled, fresh clone).
          Result isi issue par aayega. 🏗️
          EOF
          )"

  # ---------------------------------------------------------------------------
  # Build — reusable pipeline (swap + toolchain + cross-compile + release)
  # ---------------------------------------------------------------------------
  build:
    needs: register
    if: ${{ needs.register.outputs.proceed == 'true' }}
    uses: ./.github/workflows/_pipeline.yml
    with:
      project: ${{ needs.register.outputs.project }}
      ref: ${{ needs.register.outputs.ref }}
      targets: ${{ needs.register.outputs.targets }}
      issue_number: ${{ github.event.issue.number }}
      publish: true
      prerelease: false
      shards: "2"

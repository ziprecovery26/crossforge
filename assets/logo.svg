<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="CrossForge logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="48" fill="#0b1020"/>
  <circle cx="120" cy="120" r="74" fill="none" stroke="url(#g)" stroke-width="3" opacity="0.55"/>
  <circle cx="120" cy="120" r="58" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.35"/>

  <!-- forge hammer -->
  <g filter="url(#glow)" stroke="url(#g)" stroke-width="10" stroke-linecap="round">
    <line x1="72" y1="168" x2="140" y2="100"/>
    <line x1="128" y1="72" x2="176" y2="120"/>
  </g>
  <rect x="118" y="62" width="70" height="34" rx="8" transform="rotate(45 153 79)" fill="url(#g)" opacity="0.9"/>

  <!-- platforms: 4 dots -->
  <g fill="#22d3ee">
    <circle cx="52" cy="52" r="7"/>
    <circle cx="188" cy="60" r="7" fill="#8b5cf6"/>
    <circle cx="60" cy="192" r="7" fill="#8b5cf6"/>
    <circle cx="186" cy="184" r="7"/>
  </g>
</svg>
